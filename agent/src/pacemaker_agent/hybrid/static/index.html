<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OneTry – Testseite</title>
<style>
body { font: 15px/1.5 system-ui, sans-serif; max-width: 760px; margin: 24px auto; padding: 0 16px; }
button, select, input { font: inherit; padding: 6px 10px; margin: 0 8px 8px 0; }
.hinweis { background: #eef4ff; padding: 8px 12px; border-radius: 6px; }
.warn { background: #fff4d6; padding: 8px 12px; border-radius: 6px; }
.u { color: #0a5; } .a { color: #05a; } .s { color: #777; font-size: 13px; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<h2>OneTry · Testseite</h2>
<p class="hinweis">Sie sprechen mit einer <b>KI-Trainingsfigur</b>, nicht mit einem Menschen.</p>
<section id="anmeldung">
  <input id="name" autocomplete="username" placeholder="Name">
  <input id="passwort" type="password" autocomplete="current-password" placeholder="Passwort">
  <button id="login">Anmelden</button>
</section>
<section id="gespraech" hidden>
  <p class="s">Angemeldet als <b id="wer"></b> · <button id="logout">Abmelden</button></p>
  <p id="kontingent" class="warn" hidden>Das Übungskontingent ist bald aufgebraucht.</p>
  <p>Stimme:
    <select id="stimme">
      <option value="">Standard</option>
      <option>vesper</option><option>meridian</option><option>stone</option><option>ripple</option>
      <option>gleam</option><option>willow</option><option>quartz</option><option>delta</option>
    </select>
    <button id="start">Gespräch starten</button>
    <button id="ende" disabled>Beenden</button>
  </p>
</section>
<p id="status" class="s">Bitte melden Sie sich an.</p>
<audio id="audio" autoplay></audio>
<div id="log"></div>
<script>
const $ = (id) => document.getElementById(id);
const post = (url, body) => fetch(url, { method: "POST", headers: { "Content-Type": "application/json" },
  body: JSON.stringify(body || {}) });
let peer = null, mic = null, ref = null, aktuell = null, beendet = true;
// Herzschlag: Lebenszeichen an den Server; ohne Bestätigung innerhalb der Frist endet das
// Gespräch auch lokal (Server beendet es seinerseits nach 15 s ohne Herzschlag).
const HERZ_TAKT_MS = 5000, HERZ_FRIST_MS = 15000, HERZ_ANFRAGE_MS = 4000;
let herz = null; // Kontext des laufenden Gesprächs; veraltete Antworten wirken nicht

function status(text) { $("status").textContent = text; }
async function meldung(r) { try { return (await r.json()).meldung || "Fehler"; } catch { return "Fehler"; } }

async function angemeldet(name) {
  $("wer").textContent = name; $("anmeldung").hidden = true; $("gespraech").hidden = false;
  status("Bereit.");
  const s = await fetch("/api/status");
  if (s.ok) $("kontingent").hidden = !(await s.json()).kontingent_knapp;
}
$("login").onclick = async () => {
  const r = await post("/api/login", { name: $("name").value, passwort: $("passwort").value });
  $("passwort").value = "";
  if (r.ok) angemeldet((await r.json()).name); else status(await meldung(r));
};
$("logout").onclick = async () => { await post("/api/logout"); location.reload(); };

function zeile(rolle, text) {
  if (!aktuell || aktuell.rolle !== rolle) {
    const p = document.createElement("div");
    p.className = rolle === "user" ? "u" : "a";
    p.textContent = rolle === "user" ? "Sie: " : "Persona: ";
    $("log").append(p); aktuell = { rolle, p };
  }
  aktuell.p.textContent += text;
}
function herzStop() {
  if (!herz) return;
  clearInterval(herz.timer); herz.ctrl?.abort(); herz = null;
}
function herzStart(sitzung) {
  herzStop();
  const h = { sitzung, timer: null, ctrl: null, bestaetigt: Date.now(), gesendet: 0 };
  herz = h;
  h.timer = setInterval(async () => {
    if (herz !== h) return;
    if (Date.now() - h.bestaetigt > HERZ_FRIST_MS) { aufraeumen("Verbindung zum Server verloren."); return; }
    if (h.ctrl || Date.now() - h.gesendet < HERZ_TAKT_MS) return; // höchstens eine offene Anfrage
    h.gesendet = Date.now();
    const ctrl = (h.ctrl = new AbortController());
    const abbruch = setTimeout(() => ctrl.abort(), HERZ_ANFRAGE_MS);
    let r = null;
    try {
      r = await fetch("/api/herzschlag", { method: "POST", signal: ctrl.signal,
        headers: { "Content-Type": "application/json" }, body: JSON.stringify({ session_ref: sitzung }) });
    } catch { /* Netzfehler oder Zeitüberschreitung: vorübergehend */ }
    clearTimeout(abbruch);
    if (herz !== h) return;
    h.ctrl = null;
    if (!r || r.status >= 500) return;
    if (r.ok) { h.bestaetigt = Date.now(); return; }
    if (r.status === 401) {
      aufraeumen("Bitte melden Sie sich erneut an.");
      $("anmeldung").hidden = false; $("gespraech").hidden = true;
    } else aufraeumen("Gespräch beendet."); // 404: Server kennt das Gespräch nicht mehr
  }, 1000);
}
function aufraeumen(text) {
  herzStop(); beendet = true; ref = null;
  mic?.getTracks().forEach((t) => t.stop()); peer?.close(); peer = null; mic = null;
  $("start").disabled = false; $("ende").disabled = true; status(text);
}

$("start").onclick = async () => {
  $("start").disabled = true; $("log").textContent = ""; aktuell = null; status("Verbinde …");
  try {
    mic = await navigator.mediaDevices.getUserMedia({ audio: true });
    peer = new RTCPeerConnection();
    peer.ontrack = (e) => { $("audio").srcObject = new MediaStream([e.track]); };
    mic.getAudioTracks().forEach((t) => peer.addTrack(t, mic));
    const kanal = peer.createDataChannel("oai-events");
    kanal.onmessage = ({ data }) => {
      const ev = JSON.parse(data);
      if (ev.type === "session.input_transcript.delta") zeile("user", ev.delta || "");
      else if (ev.type === "session.output_transcript.delta") zeile("assistant", ev.delta || "");
      else if (ev.type === "session.closed") aufraeumen("Gespräch beendet.");
    };
    await peer.setLocalDescription(await peer.createOffer());
    if (peer.iceGatheringState !== "complete") await new Promise((res) => {
      peer.onicegatheringstatechange = () => { if (peer.iceGatheringState === "complete") res(); };
      setTimeout(res, 5000);
    });
    const r = await post("/api/session", { sdp: peer.localDescription.sdp, stimme: $("stimme").value || null });
    if (!r.ok) { aufraeumen(await meldung(r)); return; }
    const antwort = await r.json();
    ref = antwort.session_ref; beendet = false; herzStart(ref);
    await peer.setRemoteDescription({ type: "answer", sdp: antwort.sdp });
    $("ende").disabled = false; status("Verbunden – sprechen Sie.");
  } catch (e) { aufraeumen("Verbindung fehlgeschlagen."); }
};
$("ende").onclick = async () => {
  if (!ref) return;
  $("ende").disabled = true; status("Beende …");
  await post("/api/end", { session_ref: ref });
  setTimeout(() => { if (!beendet) aufraeumen("Gespräch beendet."); }, 20000);
};
// Tab schließen: Ende als Beacon mit Kennzeichen (Chrome sendet dabei meist Origin mit;
// der Server prüft Cookie, Origin falls vorhanden und session_ref)
addEventListener("pagehide", () => {
  if (ref && !beendet) navigator.sendBeacon("/api/end",
    new Blob([JSON.stringify({ session_ref: ref, grund: "tab" })], { type: "application/json" }));
});
fetch("/api/me").then(async (r) => { if (r.ok) angemeldet((await r.json()).name); });
</script>
</body>
</html>
